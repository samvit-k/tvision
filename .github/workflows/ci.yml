name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (data-free)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.21"
      - run: uv sync --locked
      - name: pytest (dataset, checkpoint and run-dependent tests skip)
        run: uv run pytest -q -rs

  web:
    name: Web UI checks
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types match the committed OpenAPI snapshot
        run: npm run gen:types && git diff --exit-code app/types/api.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate