[project]
name = "tvision"
version = "0.1.0"
description = "Research-oriented tumor-nucleus detection in H&E breast histopathology (NuCLS + YOLO)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "opencv-python",
    "ultralytics==8.4.171",
    "pydantic>=2",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]